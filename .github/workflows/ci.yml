name: CI

# 每次改动都验证「能编译 + 能构建」，不产出 Release。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type check & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsconfig 已带 skipLibCheck，这里与本地命令保持一致
      - name: Type check
        run: node node_modules/typescript/bin/tsc -noEmit -skipLibCheck

      - name: Build plugin
        run: npm run build

      # main.js 被 .gitignore 忽略，构建产物必须由 CI 现场生成，缺一即失败
      - name: Verify build output
        run: |
          for f in main.js manifest.json styles.css; do
            if [ ! -f "$f" ]; then
              echo "::error::缺少构建产物 $f"
              exit 1
            fi
          done
          ls -lh main.js manifest.json styles.css
