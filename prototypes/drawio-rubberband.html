<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>框选交互原型 · draw.io 风格</title>
<style>
  :root {
    --accent: #2962ff;          /* draw.io 经典蓝，可切换主题色 */
    --accent-fill: rgba(41, 98, 255, 0.08);
    --accent-fill-active: rgba(41, 98, 255, 0.16);
    --grid-color: #e8eaed;
    --bg: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { display: flex; flex-direction: column; background: #f1f3f4; }

  /* 顶部工具栏 */
  .toolbar {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    background: #fff; border-bottom: 1px solid #dadce0; flex-wrap: wrap;
  }
  .toolbar .group { display: flex; align-items: center; gap: 6px; padding-right: 8px; border-right: 1px solid #eee; }
  .toolbar .group:last-child { border-right: none; }
  .toolbar button {
    border: 1px solid #dadce0; background: #fff; border-radius: 6px;
    padding: 5px 10px; font-size: 13px; cursor: pointer; color: #202124;
  }
  .toolbar button:hover { background: #f1f3f4; }
  .toolbar button.active { border-color: var(--accent); color: var(--accent); background: var(--accent-fill); }
  .toolbar label { font-size: 12px; color: #5f6368; display: flex; align-items: center; gap: 4px; }
  .toolbar input[type=color] { width: 26px; height: 26px; border: none; background: none; cursor: pointer; padding: 0; }
  .toolbar .hint { font-size: 12px; color: #80868b; margin-left: auto; }

  /* 画布区 */
  .stage {
    flex: 1; position: relative; overflow: hidden; background: #f1f3f4;
    display: flex; align-items: center; justify-content: center;
  }
  .viewport {
    position: relative; width: 820px; height: 560px;
    background: var(--bg);
    background-image:
      linear-gradient(var(--grid-color) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
    background-size: 20px 20px;
    box-shadow: 0 1px 6px rgba(60,64,67,0.15);
    overflow: hidden; cursor: default; user-select: none;
  }
  /* world 承载缩放/平移 */
  .world { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform-origin: 0 0; }

  .shape {
    position: absolute; border: 1.5px solid #5f6368; background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: #3c4043; transition: outline-color .05s;
    outline: 0 solid transparent; outline-offset: 2px;
  }
  .shape.selected { outline: 2px solid var(--accent); }
  .shape.circle { border-radius: 50%; }
  .shape.fill-blue { background: #e8f0fe; border-color: #4285f4; }
  .shape.fill-green { background: #e6f4ea; border-color: #34a853; }
  .shape.fill-amber { background: #fef7e0; border-color: #fbbc04; }

  /* 框选矩形（屏幕坐标，覆盖在 viewport 上） */
  .rubberband {
    position: absolute; pointer-events: none; z-index: 50;
    border: 1px solid var(--accent);
    background: var(--accent-fill);
    border-radius: 2px; box-sizing: border-box;
  }
  .rubberband.active {
    border-width: 2px;
    background: var(--accent-fill-active);
  }

  /* 状态条 */
  .statusbar {
    display: flex; gap: 18px; padding: 6px 12px; background: #fff;
    border-top: 1px solid #dadce0; font-size: 12px; color: #5f6368;
  }
  .statusbar b { color: #202124; font-weight: 600; }
  .debug { font-family: ui-monospace, "SF Mono", Menlo, monospace; color: #80868b; }

  .overlay-tip {
    position: absolute; left: 12px; top: 12px; z-index: 60;
    background: rgba(32,33,36,.82); color: #fff; font-size: 12px;
    padding: 8px 10px; border-radius: 6px; line-height: 1.6; max-width: 250px;
    pointer-events: none;
  }
  .overlay-tip kbd { background:#fff;color:#202124;border-radius:4px;padding:0 5px;font-family:inherit;font-size:11px; }
</style>
</head>
<body>
  <div class="toolbar">
    <div class="group">
      <button id="zoomOut">－</button>
      <span id="zoomLabel" style="font-size:12px;width:46px;text-align:center;">100%</span>
      <button id="zoomIn">＋</button>
      <button id="zoomReset">重置视图</button>
    </div>
    <div class="group">
      <button id="panToggle">平移模式：关</button>
    </div>
    <div class="group">
      <label><input type="radio" name="mode" value="strict" checked /> 严格包含（draw.io）</label>
      <label><input type="radio" name="mode" value="intersect" /> 相交即选</label>
    </div>
    <div class="group">
      <label>主题色 <input type="color" id="accent" value="#2962ff" /></label>
    </div>
    <span class="hint">在画布空白处按住左键拖拽即可框选 · 滚轮缩放</span>
  </div>

  <div class="stage">
    <div class="viewport" id="viewport">
      <div class="world" id="world">
        <!-- 图形由 JS 注入，坐标均为 world（图）坐标 -->
      </div>
      <div class="rubberband" id="rubberband" style="display:none;"></div>
      <div class="overlay-tip">
        <b>验证要点</b><br/>
        1. 缩放后框选是否仍精确对齐图形<br/>
        2. 平移后是否仍然准确<br/>
        3. 严格包含：只有完整落框内的图形被选中
      </div>
    </div>
  </div>

  <div class="statusbar">
    <span>缩放：<b id="sZoom">100%</b></span>
    <span>平移：<b id="sPan">0, 0</b></span>
    <span>已选中：<b id="sCount">0</b> 个图形</span>
    <span class="debug" id="sDebug">screen→world: ——</span>
  </div>

<script>
(function () {
  const viewport = document.getElementById('viewport');
  const world = document.getElementById('world');
  const rubber = document.getElementById('rubberband');
  const sZoom = document.getElementById('sZoom');
  const sPan = document.getElementById('sPan');
  const sCount = document.getElementById('sCount');
  const sDebug = document.getElementById('sDebug');
  const zoomLabel = document.getElementById('zoomLabel');
  const panToggle = document.getElementById('panToggle');

  // 视图状态：缩放 + 平移（像素）
  let scale = 1, tx = 0, ty = 0;
  let panMode = false;

  // 用 world 坐标定义图形
  const SHAPES = [
    { x: 60,  y: 60,  w: 120, h: 70,  cls: 'fill-blue',   label: 'A' },
    { x: 240, y: 80,  w: 110, h: 110, cls: 'circle fill-green', label: 'B' },
    { x: 420, y: 60,  w: 140, h: 60,  cls: 'fill-amber',  label: 'C' },
    { x: 120, y: 220, w: 90,  h: 90,  cls: '',            label: 'D' },
    { x: 320, y: 240, w: 160, h: 80,  cls: 'fill-blue',   label: 'E' },
    { x: 560, y: 200, w: 100, h: 100, cls: 'circle',      label: 'F' },
    // 故意放一个靠近边缘、便于测试"严格包含"的图形
    { x: 690, y: 400, w: 90,  h: 90,  cls: 'fill-amber',  label: 'G' },
  ];

  const shapeEls = [];
  SHAPES.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'shape ' + s.cls;
    el.style.left = s.x + 'px';
    el.style.top = s.y + 'px';
    el.style.width = s.w + 'px';
    el.style.height = s.h + 'px';
    el.textContent = s.label;
    el.dataset.idx = i;
    world.appendChild(el);
    shapeEls.push(el);
  });

  function applyTransform() {
    world.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
    sZoom.textContent = Math.round(scale * 100) + '%';
    zoomLabel.textContent = Math.round(scale * 100) + '%';
    sPan.textContent = `${Math.round(tx)}, ${Math.round(ty)}`;
  }

  // 屏幕（viewport 本地）坐标 -> world（图）坐标
  function screenToWorld(clientX, clientY) {
    const r = viewport.getBoundingClientRect();
    const lx = clientX - r.left;
    const ly = clientY - r.top;
    return { x: (lx - tx) / scale, y: (ly - ty) / scale };
  }

  // 命中判定
  function getMarqueeWorld(sx0, sy0, sx1, sy1) {
    const a = screenToWorld(sx0, sy0);
    const b = screenToWorld(sx1, sy1);
    const minX = Math.min(a.x, b.x), maxX = Math.max(a.x, b.x);
    const minY = Math.min(a.y, b.y), maxY = Math.max(a.y, b.y);
    return { minX, minY, maxX, maxY };
  }

  function shapeHit(s, m, strict) {
    if (strict) {
      // 完全落在框内
      return s.x >= m.minX && s.y >= m.minY &&
             s.x + s.w <= m.maxX && s.y + s.h <= m.maxY;
    } else {
      // 任意相交
      return !(s.x > m.maxX || s.x + s.w < m.minX ||
               s.y > m.maxY || s.y + s.h < m.minY);
    }
  }

  function applySelection(m) {
    const strict = document.querySelector('input[name=mode]:checked').value === 'strict';
    let count = 0;
    SHAPES.forEach((s, i) => {
      const hit = shapeHit(s, m, strict);
      shapeEls[i].classList.toggle('selected', hit);
      if (hit) count++;
    });
    sCount.textContent = count;
    rubber.classList.toggle('active', count > 0);
  }

  // ===== 交互：框选 + 平移 =====
  let dragging = false, mode = null; // 'select' | 'pan'
  let startX = 0, startY = 0, panStartTx = 0, panStartTy = 0;

  viewport.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    const r = viewport.getBoundingClientRect();
    startX = e.clientX; startY = e.clientY;

    if (panMode || e.button === 1 || e.altKey) {
      mode = 'pan';
      panStartTx = tx; panStartTy = ty;
    } else {
      // 仅当起点在空白处才框选（点中图形不触发框选，与 draw.io 一致）
      const t = e.target;
      if (t.classList.contains('shape')) return;
      mode = 'select';
      rubber.style.display = 'block';
      rubber.style.left = (e.clientX - r.left) + 'px';
      rubber.style.top = (e.clientY - r.top) + 'px';
      rubber.style.width = '0px';
      rubber.style.height = '0px';
      rubber.classList.remove('active');
    }
    dragging = true;
    sDebug.textContent = `screen→world: ${JSON.stringify(screenToWorld(e.clientX, e.clientY))}`;
    e.preventDefault();
  });

  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    if (mode === 'pan') {
      tx = panStartTx + (e.clientX - startX);
      ty = panStartTy + (e.clientY - startY);
      applyTransform();
      return;
    }
    const r = viewport.getBoundingClientRect();
    const x0 = Math.min(startX, e.clientX) - r.left;
    const y0 = Math.min(startY, e.clientY) - r.top;
    const w = Math.abs(e.clientX - startX);
    const h = Math.abs(e.clientY - startY);
    rubber.style.left = x0 + 'px';
    rubber.style.top = y0 + 'px';
    rubber.style.width = w + 'px';
    rubber.style.height = h + 'px';

    // 实时命中（world 坐标）
    const m = getMarqueeWorld(startX, startY, e.clientX, e.clientY);
    applySelection(m);
    sDebug.textContent = `marquee world: ${Math.round(m.minX)},${Math.round(m.minY)} → ${Math.round(m.maxX)},${Math.round(m.maxY)}`;
  });

  window.addEventListener('mouseup', (e) => {
    if (!dragging) return;
    dragging = false;
    if (mode === 'select') {
      // 框过小（点击）则清空选择
      const w = Math.abs(e.clientX - startX);
      const h = Math.abs(e.clientY - startY);
      if (w < 3 && h < 3) {
        shapeEls.forEach(el => el.classList.remove('selected'));
        sCount.textContent = 0;
      }
      rubber.style.display = 'none';
    }
    mode = null;
  });

  // 滚轮缩放（以鼠标为锚点，与插件实现一致）
  viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    const r = viewport.getBoundingClientRect();
    const lx = e.clientX - r.left;
    const ly = e.clientY - r.top;
    const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
    const newScale = Math.min(4, Math.max(0.25, scale * factor));
    // 锚点缩放：保持鼠标下的 world 点不动
    const wx = (lx - tx) / scale;
    const wy = (ly - ty) / scale;
    scale = newScale;
    tx = lx - wx * scale;
    ty = ly - wy * scale;
    applyTransform();
  }, { passive: false });

  // ===== 工具栏 =====
  document.getElementById('zoomIn').onclick = () => { scale = Math.min(4, scale * 1.2); applyTransform(); };
  document.getElementById('zoomOut').onclick = () => { scale = Math.max(0.25, scale / 1.2); applyTransform(); };
  document.getElementById('zoomReset').onclick = () => { scale = 1; tx = 0; ty = 0; applyTransform(); };
  panToggle.onclick = () => {
    panMode = !panMode;
    panToggle.textContent = '平移模式：' + (panMode ? '开' : '关');
    panToggle.classList.toggle('active', panMode);
    viewport.style.cursor = panMode ? 'grab' : 'default';
  };
  document.getElementById('accent').oninput = (e) => {
    const c = e.target.value;
    const hex = c;
    // 用 color-mix 思路：直接写 fill 的 rgba 需要解析，简化为 CSS 变量 + 透明度
    document.documentElement.style.setProperty('--accent', hex);
    // 从 hex 解析出 rgb 设 fill
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    document.documentElement.style.setProperty('--accent-fill', `rgba(${r},${g},${b},0.08)`);
    document.documentElement.style.setProperty('--accent-fill-active', `rgba(${r},${g},${b},0.16)`);
  };

  applyTransform();
})();
</script>
</body>
</html>
