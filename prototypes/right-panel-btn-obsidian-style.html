<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>右侧面板 · 按钮样式对照</title>
<style>
/* ============================================================
   主题变量：复刻用户实际在用的 Catppuccin（Latte / Mocha）
   颜色取自截图反推：base #eff1f5 / mantle #e6e9ef / surface0 #ccd0da
   ============================================================ */
:root {
  --background-primary: #eff1f5;
  --background-secondary: #e6e9ef;
  --background-primary-alt: #e6e9ef;
  --background-modifier-border: #ccd0da;
  --background-modifier-border-hover: #bcc0cc;
  --background-modifier-border-focus: #1e66f5;
  --background-modifier-hover: rgba(76, 79, 105, 0.08);
  --background-modifier-active-hover: rgba(76, 79, 105, 0.16);
  --text-normal: #4c4f69;
  --text-muted: #6c6f85;
  --text-faint: #8c8fa1;
  --text-accent: #1e66f5;
  --text-color: var(--text-normal);
  --interactive-normal: #ccd0da;
  --interactive-hover: #bcc0cc;
  --interactive-accent: #1e66f5;
  --text-on-accent: #ffffff;
  --input-shadow: inset 0 0 0 1px rgba(76, 79, 105, 0.06);
  --input-radius: 6px;
  --radius-s: 6px;
  --size-4-1: 4px;
  --size-4-2: 8px;
  --size-2-2: 4px;
  --font-ui-small: 13px;
  --icon-color: var(--text-muted);
  --icon-color-hover: var(--text-normal);
  --icon-opacity: 0.85;
  --cursor: default;
  --cursor-link: pointer;
  --check-accent: #40a02b;
}
body.theme-dark {
  --background-primary: #1e1e2e;
  --background-secondary: #181825;
  --background-primary-alt: #181825;
  --background-modifier-border: #313244;
  --background-modifier-border-hover: #45475a;
  --background-modifier-border-focus: #89b4fa;
  --background-modifier-hover: rgba(205, 214, 244, 0.08);
  --background-modifier-active-hover: rgba(205, 214, 244, 0.16);
  --text-normal: #cdd6f4;
  --text-muted: #a6adc8;
  --text-faint: #7f849c;
  --text-accent: #89b4fa;
  --interactive-normal: #313244;
  --interactive-hover: #45475a;
  --interactive-accent: #89b4fa;
  --text-on-accent: #1e1e2e;
  --input-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35);
  --icon-color: var(--text-muted);
  --icon-color-hover: var(--text-normal);
  --check-accent: #a6e3a1;
}

/* ============================================================
   ① 复刻 Obsidian app.css 里真正会覆盖插件自绘按钮的那条规则
   —— 原型里必须带上它，否则「修复前」看起来是好的，对照就失去意义
   ============================================================ */
button:not(.clickable-icon) {
  appearance: none;
  color: var(--text-color);
  background-color: var(--interactive-normal);
  padding: var(--size-4-1) var(--size-4-2);
  border-radius: var(--input-radius);
  font-size: var(--font-ui-small);
  font-family: inherit;
  flex-shrink: 0;
  box-shadow: var(--input-shadow);
  cursor: var(--cursor);
  overflow: hidden;
}
button:not(.clickable-icon):hover { background-color: var(--interactive-hover); }
button:not(.clickable-icon):active {
  background-color: var(--interactive-accent);
  color: var(--text-on-accent);
}
/* Obsidian 自己的图标按钮类（修复后给铅笔挂上） */
.clickable-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--size-2-2);
  border-radius: var(--radius-s);
  color: var(--icon-color);
  cursor: var(--cursor-link);
}

/* ============================================================
   ② 页面外壳
   ============================================================ */
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 24px;
  background: #f7f7f9;
  font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  color: #33333d;
}
body.theme-dark { background: #11111b; color: #cdd6f4; }
h1 { font-size: 18px; margin: 0 0 6px; }
.hint { font-size: 12.5px; line-height: 1.7; opacity: 0.75; margin-bottom: 18px; max-width: 900px; }
.hint code { background: rgba(127, 127, 127, 0.16); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
.toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; }
.toolbar button {
  font: inherit; font-size: 13px; padding: 6px 14px; border-radius: 6px;
  border: 1px solid rgba(127,127,127,0.35); background: rgba(127,127,127,0.1); cursor: pointer;
  color: inherit;
}
.toolbar button:hover { background: rgba(127,127,127,0.2); }

.cols { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
.col { }
.col > h2 {
  font-size: 13px; font-weight: 600; margin: 0 0 8px; letter-spacing: 0.4px;
  text-transform: uppercase; opacity: 0.7;
}
.col .tag {
  display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 20px;
  margin-left: 6px; vertical-align: middle; text-transform: none; letter-spacing: 0;
}
.col.bad .tag { background: rgba(226, 75, 74, 0.16); color: #d20f39; }
.col.good .tag { background: rgba(64, 160, 43, 0.18); color: #40a02b; }
body.theme-dark .col.bad .tag { color: #f38ba8; background: rgba(243, 139, 168, 0.18); }
body.theme-dark .col.good .tag { color: #a6e3a1; background: rgba(166, 227, 161, 0.18); }

/* 面板舞台：300px 右侧面板 */
.stage {
  width: 300px;
  height: 620px;
  background: var(--background-secondary);
  color: var(--text-normal);
  border: 1px solid var(--background-modifier-border);
  border-radius: 8px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  font-size: 13px;
}

/* ============================================================
   ③ 面板布局（非按钮，两个面板共用；这些属性 Obsidian 不会覆盖）
   ============================================================ */
.drawio-fmt-tabs { display: flex; border-bottom: 1px solid var(--background-modifier-border); background: var(--background-primary-alt); flex-shrink: 0; }
.drawio-fmt-tab.active::after {
  content: ""; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 28px; height: 3px; background: var(--text-accent);
  border-radius: 2px 2px 0 0;
}
.drawio-fmt-body { flex: 1; overflow-y: auto; padding: 12px; }
.drawio-fmt-group-title { font-size: 13px; font-weight: 600; color: var(--text-normal); padding-top: 12px; margin-top: 12px; border-top: 1px solid var(--background-modifier-border); }
.drawio-fmt-group-title:first-child { padding-top: 0; margin-top: 0; border-top: none; }
.drawio-fmt-group-body { padding: 10px 0 2px; }
.drawio-fmt-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.drawio-fmt-row:last-child { margin-bottom: 0; }
.drawio-fmt-label, .drawio-fmt-label-wide { font-size: 13px; color: var(--text-normal); }
.drawio-fmt-label { min-width: 56px; }
.drawio-fmt-label-wide { min-width: 72px; }
.drawio-fmt-check { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: var(--text-normal); }
.drawio-fmt-spacer, .drawio-fmt-grow { flex: 1; min-width: 0; }
.drawio-fmt-divider { height: 1px; background: var(--background-modifier-border); margin: 12px 0; }
.drawio-fmt-select { flex: 1; min-width: 0; padding: 5px 8px; border: 1px solid var(--background-modifier-border); border-radius: 5px; background: var(--background-primary); font-size: 13px; color: var(--text-normal); outline: none; }
.drawio-fmt-number { display: inline-flex; align-items: center; border: 1px solid var(--background-modifier-border); border-radius: 5px; overflow: hidden; background: var(--background-primary); }
.drawio-fmt-number input { width: 50px; border: none; padding: 5px 6px; font-size: 13px; outline: none; background: transparent; color: var(--text-normal); text-align: right; }
.drawio-fmt-unit { padding: 5px 6px 5px 0; font-size: 12px; color: var(--text-muted); }
.drawio-fmt-radios { display: flex; align-items: center; gap: 16px; }
.drawio-fmt-radio { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-normal); cursor: pointer; }
.drawio-fmt-colorbox { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.drawio-fmt-colorswatch { position: relative; width: 38px; height: 22px; border: 1px solid var(--background-modifier-border); border-radius: 4px; cursor: pointer; overflow: hidden; flex-shrink: 0; }
.drawio-fmt-colorswatch input { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: none; opacity: 0; cursor: pointer; }
.drawio-fmt-spin { display: flex; flex-direction: column; align-self: stretch; border-left: 1px solid var(--background-modifier-border); }
.drawio-fmt-block { width: 100%; }

/* 复选框 / 单选框：复刻 Obsidian 原生样式 */
input[type="checkbox"], input[type="radio"] {
  appearance: none; margin: 0; flex-shrink: 0; position: relative; cursor: pointer;
  background: var(--background-primary);
  border: 1px solid var(--background-modifier-border-hover);
}
input[type="checkbox"] { width: 16px; height: 16px; border-radius: 4px; }
input[type="radio"] { width: 15px; height: 15px; border-radius: 50%; }
input[type="checkbox"]:checked { background: var(--check-accent); border-color: var(--check-accent); }
input[type="checkbox"]:checked::after {
  content: ""; position: absolute; left: 4.5px; top: 1px;
  width: 4px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg);
}
input[type="radio"]:checked { border-color: var(--text-accent); box-shadow: inset 0 0 0 4px var(--text-accent); }

/* ============================================================
   ④ 【修复前】原始样式：选择器是纯单类名 → 特异性 (0,1,0)
      用 :where() 把外层 .before 归零，忠实还原当时真实特异性
   ============================================================ */
.before :where(.drawio-fmt-tab) { flex: 1; padding: 9px 0; border: none; background: transparent; font-size: 13px; color: var(--text-muted); cursor: pointer; position: relative; }
.before :where(.drawio-fmt-tab):hover { color: var(--text-normal); }
.before :where(.drawio-fmt-tab).active { color: var(--text-accent); background: transparent; font-weight: 500; }
.before :where(.drawio-fmt-tbtn) { min-width: 30px; height: 30px; padding: 0 8px; border: 1px solid var(--background-modifier-border); background: var(--background-primary); border-radius: 5px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--text-normal); }
.before :where(.drawio-fmt-tbtn):hover { background: var(--background-modifier-hover); }
.before :where(.drawio-fmt-tbtn).active { background: rgba(22, 125, 255, 0.12); border-color: rgba(22, 125, 255, 0.4); color: #167dff; }
.before :where(.drawio-fmt-tbtn).icon { padding: 0; }
.before :where(.drawio-fmt-arrange-btn) { padding: 7px 0; border: 1px solid var(--background-modifier-border); background: var(--background-primary); border-radius: 5px; font-size: 13px; cursor: pointer; color: var(--text-normal); }
.before :where(.drawio-fmt-arrange-btn):hover { background: var(--background-modifier-hover); }
.before :where(.drawio-fmt-bottom-btn) { width: 100%; padding: 7px 0; border: 1px solid var(--background-modifier-border); background: var(--background-primary); border-radius: 5px; font-size: 13px; cursor: pointer; color: var(--text-normal); }
.before :where(.drawio-fmt-bottom-btn):hover { background: var(--background-modifier-hover); }
.before :where(.drawio-fmt-btn) { padding: 6px 10px; border: 1px solid var(--background-modifier-border); border-radius: 5px; background: var(--background-primary); font-size: 13px; color: var(--text-normal); cursor: pointer; white-space: nowrap; }
.before :where(.drawio-fmt-btn):hover { background: var(--background-modifier-hover); }
.before :where(.drawio-fmt-btn).active { background: rgba(22, 125, 255, 0.12); border-color: rgba(22, 125, 255, 0.45); color: #167dff; }
.before :where(.drawio-fmt-pencil) { display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; padding: 0; border: 1px solid var(--background-modifier-border); border-radius: 4px; background: var(--background-primary); color: var(--text-muted); cursor: pointer; flex-shrink: 0; }
.before :where(.drawio-fmt-pencil):hover { background: var(--background-modifier-hover); color: var(--text-normal); }
.before :where(.drawio-fmt-pencil) svg { width: 13px; height: 13px; }
.before :where(.drawio-fmt-spin-btn) { flex: 1; width: 18px; padding: 0; border: none; background: var(--background-primary); color: var(--text-muted); font-size: 7px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.before :where(.drawio-fmt-spin-btn):first-child { border-bottom: 1px solid var(--background-modifier-border); }
.before :where(.drawio-fmt-spin-btn):hover { background: var(--background-modifier-hover); color: var(--text-normal); }

/* ============================================================
   ⑤ 【修复后】改动后的样式：父级前缀提权到 (0,2,0)+ → 稳赢 (0,1,1)
   ============================================================ */
.after .drawio-fmt-tabs .drawio-fmt-tab { flex: 1; padding: 9px 4px; border: none; border-radius: 0; background: transparent; box-shadow: none; appearance: none; min-width: 0; min-height: 0; font-family: inherit; font-size: var(--font-ui-small); line-height: 1.2; color: var(--text-muted); cursor: pointer; position: relative; transition: background-color .15s ease, color .15s ease; }
.after .drawio-fmt-tabs .drawio-fmt-tab:hover { background: var(--background-modifier-hover); color: var(--text-normal); }
.after .drawio-fmt-tabs .drawio-fmt-tab.active { background: transparent; color: var(--text-accent); font-weight: 500; }
.after .drawio-fmt-tabs .drawio-fmt-tab:focus-visible,
.after .drawio-fmt-body .drawio-fmt-btn:focus-visible,
.after .drawio-fmt-body .drawio-fmt-tbtn:focus-visible,
.after .drawio-fmt-body .drawio-fmt-arrange-btn:focus-visible,
.after .drawio-fmt-body .drawio-fmt-pencil:focus-visible,
.after .drawio-fmt-body .drawio-fmt-spin-btn:focus-visible { outline: 2px solid var(--background-modifier-border-focus); outline-offset: -2px; }

.after .drawio-fmt-body .drawio-fmt-btn { padding: 6px 12px; border: none; border-radius: var(--radius-s); background: var(--interactive-normal); box-shadow: none; appearance: none; min-width: 0; font-family: inherit; font-size: var(--font-ui-small); line-height: 1.2; color: var(--text-normal); cursor: pointer; white-space: nowrap; transition: background-color .15s ease, color .15s ease; }
.after .drawio-fmt-body .drawio-fmt-btn:hover { background: var(--interactive-hover); }
.after .drawio-fmt-body .drawio-fmt-btn:active { background: var(--background-modifier-active-hover); }
.after .drawio-fmt-body .drawio-fmt-btn.active { background: rgba(22, 125, 255, 0.12); color: #167dff; font-weight: 500; }
.after .drawio-fmt-body .drawio-fmt-tbtn { min-width: 30px; height: 30px; padding: 0 8px; border: none; border-radius: var(--radius-s); background: var(--interactive-normal); box-shadow: none; appearance: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: inherit; font-size: var(--font-ui-small); line-height: 1.2; color: var(--text-normal); transition: background-color .15s ease, color .15s ease; }
.after .drawio-fmt-body .drawio-fmt-tbtn:hover { background: var(--interactive-hover); }
.after .drawio-fmt-body .drawio-fmt-tbtn:active { background: var(--background-modifier-active-hover); }
.after .drawio-fmt-body .drawio-fmt-tbtn.active { background: rgba(22, 125, 255, 0.12); color: #167dff; font-weight: 600; }
.after .drawio-fmt-body .drawio-fmt-tbtn.icon { padding: 0; }
.after .drawio-fmt-body .drawio-fmt-arrange-btn { padding: 7px 0; border: none; border-radius: var(--radius-s); background: var(--interactive-normal); box-shadow: none; appearance: none; font-family: inherit; font-size: var(--font-ui-small); line-height: 1.2; cursor: pointer; color: var(--text-normal); transition: background-color .15s ease, color .15s ease; }
.after .drawio-fmt-body .drawio-fmt-arrange-btn:hover { background: var(--interactive-hover); }
.after .drawio-fmt-body .drawio-fmt-arrange-btn:active { background: var(--background-modifier-active-hover); }
.after .drawio-fmt-bottom .drawio-fmt-bottom-btn { width: 100%; padding: 7px 0; border: none; border-radius: var(--radius-s); background: var(--interactive-normal); box-shadow: none; appearance: none; font-family: inherit; font-size: var(--font-ui-small); line-height: 1.2; cursor: pointer; color: var(--text-normal); transition: background-color .15s ease, color .15s ease; }
.after .drawio-fmt-bottom .drawio-fmt-bottom-btn:hover { background: var(--interactive-hover); }
.after .drawio-fmt-bottom .drawio-fmt-bottom-btn:active { background: var(--background-modifier-active-hover); }
.after .drawio-fmt-body .drawio-fmt-pencil { display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; padding: 0; border: none; border-radius: var(--radius-s); background: transparent; box-shadow: none; appearance: none; min-width: 0; min-height: 0; color: var(--icon-color); opacity: var(--icon-opacity); cursor: pointer; flex-shrink: 0; transition: background-color .15s ease, color .15s ease, opacity .15s ease; }
.after .drawio-fmt-body .drawio-fmt-pencil:hover { background: var(--background-modifier-hover); color: var(--icon-color-hover); opacity: 1; }
.after .drawio-fmt-body .drawio-fmt-pencil:active { background: var(--background-modifier-active-hover); }
.after .drawio-fmt-body .drawio-fmt-pencil svg { width: 14px; height: 14px; pointer-events: none; }
.after .drawio-fmt-body .drawio-fmt-spin-btn { flex: 1; width: 18px; padding: 0; border: none; border-radius: 0; background: transparent; box-shadow: none; appearance: none; min-width: 0; min-height: 0; color: var(--icon-color); font-size: 7px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background-color .15s ease, color .15s ease; }
.after .drawio-fmt-body .drawio-fmt-spin-btn:first-child { border-bottom: 1px solid var(--background-modifier-border); }
.after .drawio-fmt-body .drawio-fmt-spin-btn:hover { background: var(--background-modifier-hover); color: var(--text-normal); }
</style>
</head>
<body>

<h1>右侧面板 · 按钮样式对照</h1>
<p class="hint">
  同一条 Obsidian 规则 <code>button:not(.clickable-icon)</code>（特异性 <code>(0,1,1)</code>）已抄进本页，
  「修复前」用 <code>:where()</code> 把选择器还原成当时真实的 <code>(0,1,0)</code> —— 所以左右对照是真的，不是画出来的。
  <br>把鼠标移到按钮上可以看到 hover / 按下反馈。注意看：<strong>未激活页签</strong>、<strong>更改…</strong>、<strong>编辑数据…</strong>、
  <strong>铅笔</strong>、数字框里的 <strong>▲▼</strong> 在修复前都是「灰底 + 一圈硬边框 + 内描边」。
</p>

<div class="toolbar">
  <button id="themeBtn" type="button">切换 亮色 / 暗色（Catppuccin Latte / Mocha）</button>
</div>

<div class="cols">
  <div class="col bad">
    <h2>修复前 <span class="tag">灰底 + 硬边框</span></h2>
    <div class="stage before" id="before"></div>
  </div>
  <div class="col good">
    <h2>修复后 <span class="tag">Obsidian 原生按钮</span></h2>
    <div class="stage after" id="after"></div>
  </div>
</div>

<script>
const PENCIL_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>';

function panel(id, pencilCls) {
  return `
  <div class="drawio-fmt-tabs">
    <button type="button" class="drawio-fmt-tab active">绘图</button>
    <button type="button" class="drawio-fmt-tab">样式</button>
  </div>
  <div class="drawio-fmt-body">
    <div class="drawio-fmt-group-title">查看</div>
    <div class="drawio-fmt-group-body">
      <div class="drawio-fmt-row">
        <label class="drawio-fmt-check"><input type="checkbox" checked><span>网格</span></label>
        <div class="drawio-fmt-spacer"></div>
        <div class="drawio-fmt-number">
          <input type="number" value="10">
          <span class="drawio-fmt-unit">pt</span>
          <div class="drawio-fmt-spin">
            <button type="button" class="drawio-fmt-spin-btn">▲</button>
            <button type="button" class="drawio-fmt-spin-btn">▼</button>
          </div>
        </div>
        <div class="drawio-fmt-colorbox">
          <div class="drawio-fmt-colorswatch" style="background:#d0d0d0"><input type="color" value="#d0d0d0"></div>
          <button type="button" class="${pencilCls}" title="网格颜色">${PENCIL_SVG}</button>
        </div>
      </div>
      <div class="drawio-fmt-row"><label class="drawio-fmt-check"><input type="checkbox" checked><span>页面视图</span></label></div>
      <div class="drawio-fmt-row">
        <span class="drawio-fmt-label-wide">背景</span>
        <button type="button" class="drawio-fmt-btn drawio-fmt-grow">更改…</button>
      </div>
      <div class="drawio-fmt-row"><label class="drawio-fmt-check"><input type="checkbox"><span>背景色</span></label></div>
      <div class="drawio-fmt-row"><label class="drawio-fmt-check"><input type="checkbox"><span>阴影</span></label></div>
    </div>

    <div class="drawio-fmt-group-title">选项</div>
    <div class="drawio-fmt-group-body">
      <div class="drawio-fmt-row"><label class="drawio-fmt-check"><input type="checkbox" checked><span>连接箭头</span></label></div>
      <div class="drawio-fmt-row"><label class="drawio-fmt-check"><input type="checkbox" checked><span>连接点</span></label></div>
      <div class="drawio-fmt-row"><label class="drawio-fmt-check"><input type="checkbox" checked><span>参考线</span></label></div>
    </div>

    <div class="drawio-fmt-group-title">页面尺寸</div>
    <div class="drawio-fmt-group-body">
      <div class="drawio-fmt-row">
        <select class="drawio-fmt-select">
          <option>A4 (210 mm x 297 mm)</option>
          <option>A5 (148 mm x 210 mm)</option>
          <option>自定义…</option>
        </select>
      </div>
      <div class="drawio-fmt-row">
        <div class="drawio-fmt-radios">
          <label class="drawio-fmt-radio"><input type="radio" name="orient-${id}" checked><span>竖向</span></label>
          <label class="drawio-fmt-radio"><input type="radio" name="orient-${id}"><span>横向</span></label>
        </div>
      </div>
    </div>

    <div class="drawio-fmt-divider"></div>
    <div class="drawio-fmt-row"><button type="button" class="drawio-fmt-btn drawio-fmt-block">编辑数据…</button></div>
    <div class="drawio-fmt-row"><button type="button" class="drawio-fmt-btn drawio-fmt-block">清除默认样式</button></div>
  </div>`;
}

document.getElementById("before").innerHTML = panel("b", "drawio-fmt-pencil");
document.getElementById("after").innerHTML = panel("a", "clickable-icon drawio-fmt-pencil");

document.getElementById("themeBtn").addEventListener("click", () => {
  document.body.classList.toggle("theme-dark");
});
</script>
</body>
</html>
