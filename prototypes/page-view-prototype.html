<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>页面视图 = 页面尺寸预览 — 原型 v4（已实现）</title>
<style>
  :root {
    --bg-primary: #ffffff;
    --bg-secondary: #f7f8fa;
    --bg-tertiary: #eef0f4;
    --border: #e2e5ea;
    --text-normal: #2b2f36;
    --text-muted: #6b7280;
    --text-faint: #9aa1ac;
    --accent: #167dff;
    --grid-line: rgba(0, 0, 0, 0.08);
    --page-border: #8a8f98;
    --canvas-bg: #ffffff;
    --void-bg: #eceef2;
  }
  body.theme-dark {
    --bg-primary: #1e1e1e;
    --bg-secondary: #262626;
    --bg-tertiary: #2f2f2f;
    --border: #3a3a3a;
    --text-normal: #dcddde;
    --text-muted: #9aa1ac;
    --text-faint: #6b7280;
    --accent: #4c9aff;
    --grid-line: rgba(255, 255, 255, 0.08);
    --page-border: #6b7280;
    --canvas-bg: #1e1e1e;
    --void-bg: #171717;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg-primary);
    color: var(--text-normal);
    font-size: 13px;
    overflow: hidden;
  }

  /* ---------- 顶部说明条 ---------- */
  .topbar {
    height: 46px; display: flex; align-items: center; gap: 12px;
    padding: 0 14px; border-bottom: 1px solid var(--border);
    background: var(--bg-secondary); flex-shrink: 0;
  }
  .topbar h1 { font-size: 13px; font-weight: 600; margin: 0; }
  .topbar .hint { font-size: 12px; color: var(--text-muted); }
  .topbar .grow { flex: 1; }
  .toggle-theme {
    border: 1px solid var(--border); background: var(--bg-primary);
    color: var(--text-muted); border-radius: 5px; padding: 4px 10px;
    font-size: 12px; cursor: pointer;
  }
  .toggle-theme:hover { border-color: var(--accent); color: var(--accent); }
  .removed-tag {
    font-size: 11px; color: #d9534f; border: 1px solid #d9534f;
    border-radius: 3px; padding: 1px 6px; margin-left: 4px;
  }

  /* ---------- 布局 ---------- */
  .app { display: flex; flex-direction: column; height: calc(100% - 46px); }
  .row { display: flex; flex: 1; min-height: 0; }

  .palette {
    width: 190px; flex-shrink: 0; border-right: 1px solid var(--border);
    background: var(--bg-secondary); padding: 10px; overflow: auto;
  }
  .palette .search {
    width: 100%; padding: 5px 8px; font-size: 12px;
    border: 1px solid var(--border); border-radius: 5px;
    background: var(--bg-primary); color: var(--text-normal); margin-bottom: 10px;
  }
  .palette .grp { font-size: 11px; color: var(--text-faint); margin: 12px 0 6px; }
  .shape-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .shape-cell {
    aspect-ratio: 1; border: 1px solid transparent; border-radius: 4px;
    display: flex; align-items: center; justify-content: center; cursor: grab;
  }
  .shape-cell:hover { background: var(--bg-tertiary); border-color: var(--border); }
  .shape-cell svg { width: 22px; height: 22px; stroke: var(--text-normal); fill: none; stroke-width: 1.5; }

  /* ===== 中间画布区 ===== */
  .canvas-area {
    flex: 1; min-width: 0; min-height: 0;
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }
  .canvas-scroll {
    flex: 1; min-height: 0; overflow: auto; position: relative;
    background: var(--background-primary, #fff);
  }
  .canvas-scroll.off { background: var(--bg-primary); }
  .canvas-scroll.on {
    background: var(--void-bg);
    display: grid;
    place-content: safe center;      /* 自适应居中；溢出时退回起点，能滚到 */
    padding: 40px;                   /* 固定边距：写死，不再暴露给用户 */
  }

  /* 画布块 = 页面尺寸的 1:1 预览 */
  .graph-container { position: relative; background-color: var(--canvas-bg); }
  .canvas-scroll.off .graph-container { width: 100%; height: 100%; }
  .canvas-scroll.on .graph-container { border: 1px solid var(--page-border); }

  .shape-node {
    position: absolute; border: 1px solid #333333; background: transparent;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: var(--text-normal);
    cursor: move; user-select: none; z-index: 3;
  }
  .theme-dark .shape-node { border-color: #6272a4; }

  /* 页面尺寸标注（贴纸面左上角，原型辅助用） */
  .page-tag {
    position: absolute; top: -22px; left: 0;
    font-size: 11px; color: var(--accent);
    background: rgba(22, 125, 255, 0.1);
    border: 1px solid rgba(22, 125, 255, 0.3);
    border-radius: 3px; padding: 1px 6px; white-space: nowrap;
    pointer-events: none;
  }

  .pagebar {
    height: 34px; flex-shrink: 0; border-top: 1px solid var(--border);
    background: var(--bg-secondary); display: flex; align-items: center; gap: 4px; padding: 0 10px;
  }
  .page-tab {
    padding: 3px 12px; border-radius: 4px; font-size: 12px;
    color: var(--text-muted); cursor: pointer; border: 1px solid transparent;
  }
  .page-tab.active { background: var(--bg-primary); border-color: var(--border); color: var(--text-normal); }

  /* ---------- 右侧绘图面板 ---------- */
  .rail {
    width: 260px; flex-shrink: 0; border-left: 1px solid var(--border);
    background: var(--bg-secondary); overflow: auto;
  }
  .tabs { display: flex; border-bottom: 1px solid var(--border); }
  .tab {
    flex: 1; text-align: center; padding: 9px 0; font-size: 12px;
    color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent;
  }
  .tab.active { color: var(--text-normal); border-bottom-color: var(--accent); font-weight: 600; }
  .group-title {
    font-size: 11px; color: var(--text-faint);
    padding: 10px 12px 4px; border-top: 1px solid var(--border);
  }
  .group-title:first-of-type { border-top: none; }
  .frow {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 12px; min-height: 26px;
  }
  .frow .lbl { flex: 1; font-size: 12px; display: flex; align-items: center; gap: 6px; }
  input[type="checkbox"] { accent-color: var(--accent); width: 13px; height: 13px; margin: 0; }
  input[type="radio"] { accent-color: var(--accent); margin: 0; }
  .num {
    width: 46px; padding: 2px 5px; font-size: 12px; text-align: right;
    border: 1px solid var(--border); border-radius: 4px;
    background: var(--bg-primary); color: var(--text-normal);
  }
  .unit { font-size: 11px; color: var(--text-faint); }
  .swatch {
    width: 16px; height: 16px; border-radius: 3px;
    border: 1px solid var(--border); cursor: pointer;
  }
  select {
    width: 100%; padding: 4px 6px; font-size: 12px;
    border: 1px solid var(--border); border-radius: 4px;
    background: var(--bg-primary); color: var(--text-normal);
  }
  .radio-row { display: flex; gap: 14px; padding: 4px 12px 8px; }
  .radio-row label { font-size: 12px; display: flex; align-items: center; gap: 5px; }
  .btn-ghost {
    flex: 1; padding: 5px; font-size: 12px;
    border: 1px solid var(--border); border-radius: 4px;
    background: var(--bg-primary); color: var(--text-muted); cursor: pointer;
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

  /* 被删除的控件：划掉展示，确认用 */
  .frow.removed { opacity: 0.45; }
  .frow.removed .lbl,
  .frow.removed .num,
  .frow.removed .unit { text-decoration: line-through; }

  .badge {
    position: absolute; top: 10px; left: 10px; z-index: 20;
    background: rgba(22, 125, 255, 0.1);
    border: 1px solid rgba(22, 125, 255, 0.35);
    color: var(--accent);
    font-size: 11px; padding: 4px 9px; border-radius: 4px;
    pointer-events: none; font-weight: 600;
  }
  .zoom { position: absolute; top: 10px; right: 10px; z-index: 20; display: flex; gap: 4px; }
  .zoom button {
    border: 1px solid var(--border); background: var(--bg-secondary);
    color: var(--text-muted); border-radius: 4px; cursor: pointer;
    font-size: 11px; padding: 3px 8px;
  }
  .zoom button:hover { border-color: var(--accent); color: var(--accent); }
  .zoom .pct {
    align-self: center; min-width: 42px; text-align: center;
    font-size: 11px; color: var(--text-muted);
  }
</style>
</head>
<body>
  <div class="topbar">
    <h1>页面视图 = 页面尺寸预览</h1>
    <span class="hint">「四周留白」控件已删除<span class="removed-tag">removed</span>；纸面按页面尺寸 1:1 渲染　·　v0.16.0 已按此原型实现</span>
    <div class="grow"></div>
    <button class="toggle-theme" id="themeBtn">切换暗色</button>
  </div>

  <div class="app">
    <div class="row">
      <div class="palette">
        <input class="search" placeholder="搜索图形" />
        <div class="grp">基础形状</div>
        <div class="shape-grid">
          <div class="shape-cell"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="1"/></svg></div>
          <div class="shape-cell"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/></svg></div>
          <div class="shape-cell"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg></div>
          <div class="shape-cell"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="6"/></svg></div>
          <div class="shape-cell"><svg viewBox="0 0 24 24"><path d="M5 5h14l-7 14z"/></svg></div>
          <div class="shape-cell"><svg viewBox="0 0 24 24"><path d="M12 3l9 18H3z"/></svg></div>
          <div class="shape-cell"><svg viewBox="0 0 24 24"><path d="M12 4l8 8-8 8-8-8z"/></svg></div>
          <div class="shape-cell"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M4 4l16 16"/></svg></div>
        </div>
        <div class="grp">连线</div>
        <div class="shape-grid">
          <div class="shape-cell"><svg viewBox="0 0 24 24"><path d="M3 12h18m0 0-4-4m4 4-4 4"/></svg></div>
          <div class="shape-cell"><svg viewBox="0 0 24 24"><path d="M4 18 L12 6 L20 18"/></svg></div>
          <div class="shape-cell"><svg viewBox="0 0 24 24"><path d="M3 18 h6 v-12 h6 v12 h6"/></svg></div>
          <div class="shape-cell"><svg viewBox="0 0 24 24"><path d="M12 3v18m0 0-4-4m4 4 4-4"/></svg></div>
        </div>
      </div>

      <div class="canvas-area">
        <div class="badge" id="badge">页面视图：关</div>
        <div class="zoom">
          <button id="zoomOut">－</button>
          <span class="pct" id="zoomLabel">100%</span>
          <button id="zoomIn">＋</button>
          <button id="zoomFit">适应画布</button>
        </div>

        <div class="canvas-scroll off" id="scroll">
          <div class="graph-container" id="graph">
            <div class="page-tag" id="pageTag" style="display:none;"></div>
            <div class="shape-node" id="shapeA" style="width:86px;height:48px;left:170px;top:110px;">矩形</div>
            <div class="shape-node" id="shapeB" style="width:70px;height:70px;left:340px;top:230px;border-radius:50%;">圆形</div>
          </div>
        </div>

        <div class="pagebar">
          <div class="page-tab active">第 1 页</div>
          <div class="page-tab">第 2 页</div>
          <div class="page-tab">＋</div>
        </div>
      </div>

      <div class="rail">
        <div class="tabs">
          <div class="tab active">绘图</div>
          <div class="tab">样式</div>
        </div>

        <div class="group-title">查看</div>
        <div class="frow">
          <span class="lbl"><input type="checkbox" id="cbGrid" checked /> 网格</span>
          <input class="num" value="10" />
          <span class="unit">pt</span>
          <span class="swatch" style="background:#d0d0d0"></span>
        </div>
        <div class="frow">
          <span class="lbl"><input type="checkbox" id="cbPageView" checked /> 页面视图</span>
        </div>
        <!-- 已删除的控件（划掉仅用于确认） -->
        <div class="frow removed" title="本控件已被删除">
          <span class="lbl" style="flex:0 0 68px;">四周留白</span>
          <span class="num" style="flex:1;width:auto;text-align:left;">─────●────</span>
          <span class="unit">44 px</span>
        </div>

        <div class="group-title">背景</div>
        <div class="frow">
          <span class="lbl" style="flex:0 0 60px;">背景色</span>
          <button class="btn-ghost">更改...</button>
        </div>
        <div class="frow"><span class="lbl"><input type="checkbox" /> 背景色</span></div>
        <div class="frow"><span class="lbl"><input type="checkbox" /> 阴影</span></div>

        <div class="group-title">选项</div>
        <div class="frow"><span class="lbl"><input type="checkbox" checked /> 连接箭头</span></div>
        <div class="frow"><span class="lbl"><input type="checkbox" checked /> 连接点</span></div>
        <div class="frow"><span class="lbl"><input type="checkbox" checked /> 参考线</span></div>

        <div class="group-title">页面尺寸</div>
        <div class="frow">
          <select id="selSize">
            <option value="210x297">A4 (210 mm x 297 mm)</option>
            <option value="148x210">A5 (148 mm x 210 mm)</option>
            <option value="297x420">A3 (297 mm x 420 mm)</option>
            <option value="216x279">Letter (216 mm x 279 mm)</option>
          </select>
        </div>
        <div class="radio-row">
          <label><input type="radio" name="ori" value="portrait" checked /> 竖向</label>
          <label><input type="radio" name="ori" value="landscape" /> 横向</label>
        </div>
        <div class="frow"><button class="btn-ghost">编辑数据...</button></div>
        <div class="frow"><button class="btn-ghost">清除默认风格</button></div>
      </div>
    </div>
  </div>

<script>
  // 1 英寸 = 100 单位；A4 210x297mm -> 827 x 1169（与 mxGraph pageFormat 一致）
  const MM_TO_UNITS = (mm) => Math.round((mm / 25.4) * 100);
  const PAGE_MARGIN = 40;   // 固定居中边距（写死，不给用户调）
  const PRESETS = {
    '210x297': [210, 297],
    '148x210': [148, 210],
    '297x420': [297, 420],
    '216x279': [216, 279],
  };
  const LABEL = {
    '210x297': 'A4', '148x210': 'A5', '297x420': 'A3', '216x279': 'Letter',
  };

  const cbPageView = document.getElementById('cbPageView');
  const cbGrid = document.getElementById('cbGrid');
  const scroll = document.getElementById('scroll');
  const graph = document.getElementById('graph');
  const badge = document.getElementById('badge');
  const shapeA = document.getElementById('shapeA');
  const shapeB = document.getElementById('shapeB');
  const selSize = document.getElementById('selSize');
  const zoomLabel = document.getElementById('zoomLabel');
  const pageTag = document.getElementById('pageTag');

  let scale = 1;
  let orientation = 'portrait';

  function pageUnits() {
    const [w, h] = PRESETS[selSize.value];
    return orientation === 'landscape'
      ? [MM_TO_UNITS(h), MM_TO_UNITS(w)]
      : [MM_TO_UNITS(w), MM_TO_UNITS(h)];
  }

  // 图形位置（模型坐标，写死；缩放时按比例换算成像素）
  const NODE_A = { x: 170, y: 110, w: 86, h: 48 };
  const NODE_B = { x: 340, y: 230, w: 70, h: 70 };

  function render(keepScroll) {
    const on = cbPageView.checked;

    // 网格：画在画布块自己的背景层上
    if (cbGrid.checked) {
      const g = Math.max(4, 10 * scale);
      graph.style.backgroundImage =
        'linear-gradient(to right, var(--grid-line) 1px, transparent 1px),' +
        'linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px)';
      graph.style.backgroundSize = g + 'px ' + g + 'px';
    } else {
      graph.style.backgroundImage = 'none';
    }

    if (on) {
      const [pw, ph] = pageUnits();
      // 1:1 预览：纸面 = 页面单位 × 当前缩放
      graph.style.width = Math.round(pw * scale) + 'px';
      graph.style.height = Math.round(ph * scale) + 'px';
      scroll.className = 'canvas-scroll on';

      pageTag.style.display = '';
      pageTag.textContent =
        LABEL[selSize.value] + ' · ' + (orientation === 'landscape' ? '横向' : '竖向') +
        ' · ' + Math.round(pw * scale) + '×' + Math.round(ph * scale) + 'px';

      badge.textContent =
        '页面视图：开 · 预览 ' + LABEL[selSize.value] + '（页面单位 ' + pw + '×' + ph + '）';
    } else {
      graph.style.width = '100%';
      graph.style.height = '100%';
      scroll.className = 'canvas-scroll off';
      pageTag.style.display = 'none';
      badge.textContent = '页面视图：关 · 画布铺满可用区域';
    }

    // 图形按缩放跟随
    [[shapeA, NODE_A], [shapeB, NODE_B]].forEach(([el, n]) => {
      el.style.left = (n.x * scale) + 'px';
      el.style.top = (n.y * scale) + 'px';
      el.style.width = (n.w * scale) + 'px';
      el.style.height = (n.h * scale) + 'px';
      el.style.fontSize = Math.max(9, 12 * scale) + 'px';
    });

    zoomLabel.textContent = Math.round(scale * 100) + '%';

    // 刚开启页面视图 / 换纸型 / 改朝向：滚到纸面左上角
    if (!keepScroll) {
      scroll.scrollTop = 0;
      scroll.scrollLeft = 0;
    }
  }

  cbPageView.addEventListener('change', () => render(false));
  cbGrid.addEventListener('change', () => render(true));
  selSize.addEventListener('change', () => render(false));
  document.querySelectorAll('input[name="ori"]').forEach((r) =>
    r.addEventListener('change', () => { orientation = r.value; render(false); })
  );

  document.getElementById('zoomIn').addEventListener('click', () => {
    scale = Math.min(2, Math.round((scale + 0.25) * 100) / 100); render(true);
  });
  document.getElementById('zoomOut').addEventListener('click', () => {
    scale = Math.max(0.25, Math.round((scale - 0.25) * 100) / 100); render(true);
  });
  document.getElementById('zoomFit').addEventListener('click', () => {
    if (!cbPageView.checked) return;
    const availH = scroll.clientHeight - PAGE_MARGIN * 2;
    const [, ph] = pageUnits();
    scale = Math.max(0.1, Math.min(1, Math.round((availH / ph) * 100) / 100));
    render(false);
  });

  document.getElementById('themeBtn').addEventListener('click', (e) => {
    document.body.classList.toggle('theme-dark');
    e.target.textContent = document.body.classList.contains('theme-dark') ? '切换亮色' : '切换暗色';
  });

  // 拖拽
  let drag = null;
  [[shapeA, NODE_A], [shapeB, NODE_B]].forEach(([el]) => {
    el.addEventListener('pointerdown', (e) => {
      drag = { el, dx: e.clientX - el.offsetLeft, dy: e.clientY - el.offsetTop };
      e.preventDefault();
    });
  });
  window.addEventListener('pointermove', (e) => {
    if (!drag) return;
    drag.el.style.left = (e.clientX - drag.dx) + 'px';
    drag.el.style.top = (e.clientY - drag.dy) + 'px';
  });
  window.addEventListener('pointerup', () => { drag = null; });

  render(false);
</script>
</body>
</html>
